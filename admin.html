<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriLife - Painel do Nutricionista</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Topo do Painel Admin -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div class="text-xl font-black tracking-wider text-white">
            NUTRI<span class="text-emerald-500">LIFE</span> <span
                class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20 ml-2">Painel
                do Nutricionista</span>
        </div>
        <button id="btn-logout" class="text-sm font-medium text-slate-400 hover:text-red-400 transition-colors">
            Sair
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto p-6 md:p-10 space-y-8">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">Gestão de Dietas 📋</h1>
            <p class="text-slate-400">Adicione ou edite o plano alimentar e as substituições dos seus alunos.</p>
        </div>

        <!-- Formulário para Adicionar/Atualizar Refeição -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4">Adicionar / Atualizar Refeição</h2>
            <form id="form-dieta" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">ID do Aluno (UUID)</label>
                    <input type="text" id="aluno-uuid" placeholder="Cole aqui o UUID do aluno do Supabase" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nome da
                            Refeição</label>
                        <input type="text" id="refeicao-nome" placeholder="Ex: Café da Manhã" required
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Horário</label>
                        <input type="text" id="refeicao-horario" placeholder="Ex: 08:00" required
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Alimentos</label>
                    <textarea id="refeicao-alimentos" rows="3" placeholder="Descreva os alimentos da refeição..."
                        required
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Opções de
                        Substituição</label>
                    <textarea id="refeicao-substituicoes" rows="3" placeholder="Ex: • Pão integral ➔ Tapioca..."
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-emerald-900/20">
                    Guardar Refeição na Dieta do Aluno
                </button>
            </form>
        </section>
    </main>

    <!-- Script de Gestão -->
    <script>
        const SUPABASE_URL = 'https://dnlqkozlaqizhqsexcei.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubHFrb3psYXFpemhxc2V4Y2VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODk3MjksImV4cCI6MjEwNTc2NTcyOX0.-YEYBVHYcIBoe5taFgcC1jO2AbIYdnfI_srwif9dd7I';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Validação simples de sessão
        async function verificarSessao() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                // Redireciona para o login se não estiver autenticado
                window.location.href = 'login.html';
            }
        }

        // Submeter nova refeição / alteração
        document.getElementById('form-dieta').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alunoId = document.getElementById('aluno-uuid').value.trim();
            const refeicao = document.getElementById('refeicao-nome').value.trim();
            const horario = document.getElementById('refeicao-horario').value.trim();
            const alimentos = document.getElementById('refeicao-alimentos').value.trim();
            const substituicoes = document.getElementById('refeicao-substituicoes').value.trim();

            // Insere ou atualiza na tabela dietas
            const { error } = await supabaseClient
                .from('dietas')
                .insert([{
                    aluno_id: alunoId,
                    refeicao: refeicao,
                    horario: horario,
                    alimentos: alimentos,
                    substituicoes: substituicoes
                }]);

            if (error) {
                alert('Erro ao guardar dieta: ' + error.message);
            } else {
                alert('Refeição adicionada/atualizada com sucesso para o aluno!');
                document.getElementById('form-dieta').reset();
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });

        verificarSessao();
    </script>
</body>

</html>

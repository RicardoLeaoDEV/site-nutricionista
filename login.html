<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriLife - Entrar na Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center px-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-black tracking-wider text-white">
                NUTRI<span class="text-emerald-500">LIFE</span>
            </a>
            <p class="text-sm text-slate-400 mt-2">Aceda à sua área exclusiva de treinos e dietas</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">E-mail</label>
                <input type="email" id="email" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors"
                    placeholder="seu.email@exemplo.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Palavra-passe</label>
                <input type="password" id="password" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-emerald-500/20">
                Entrar na Plataforma
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-400 transition-colors">← Voltar para a
                página inicial</a>
        </div>
    </div>

</body>

</html>

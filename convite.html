<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite de Acesso - Real Fit Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-[url('assets/bg-pattern.svg')] bg-cover bg-center">

    <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-teal-500"></div>

        <div class="text-center mb-6">
            <div
                class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                <i data-lucide="mail-open" class="w-8 h-8 text-emerald-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Você foi convidado!</h1>
            <p class="text-slate-400 text-sm">Seu profissional de saúde enviou um convite exclusivo para você acessar o
                Real Fit Hub.</p>
        </div>

        <form id="form-convite" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Nome
                    Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="user" class="w-5 h-5 text-slate-500"></i>
                    </div>
                    <input type="text" id="nome" required
                        class="w-full bg-slate-800/50 border border-slate-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent block pl-10 p-3 transition-all"
                        placeholder="Seu nome completo">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">E-mail</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="w-5 h-5 text-slate-500"></i>
                    </div>
                    <input type="email" id="email" required
                        class="w-full bg-slate-800/50 border border-slate-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent block pl-10 p-3 transition-all"
                        placeholder="seu@email.com">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">Crie sua
                    Senha</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-500"></i>
                    </div>
                    <input type="password" id="senha" required minlength="6"
                        class="w-full bg-slate-800/50 border border-slate-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent block pl-10 p-3 transition-all"
                        placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div class="flex items-start gap-3 mt-4">
                <input type="checkbox" id="termos" required
                    class="mt-1 w-4 h-4 text-emerald-500 bg-slate-800 border-slate-600 rounded focus:ring-emerald-500">
                <label for="termos" class="text-xs text-slate-400 leading-tight">
                    Autorizo o tratamento dos meus dados de saúde e imagens pelo profissional, conforme a <a
                        href="privacidade.html" class="text-emerald-400 hover:underline">Política de Privacidade
                        (LGPD)</a>.
                </label>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-emerald-500/25">
                <span>Criar Meu Acesso</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div id="toast"
            class="absolute bottom-4 left-4 right-4 bg-red-500/10 border border-red-500/50 text-red-200 p-3 rounded-lg text-sm text-center hidden backdrop-blur-md">
        </div>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://dnlqkozlaqizhqsexcei.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubHFrb3psYXFpemhxc2V4Y2VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODk3MjksImV4cCI6MjEwNTc2NTcyOX0.-YEYBVHYcIBoe5taFgcC1jO2AbIYdnfI_srwif9dd7I';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Suporta tanto ?prof= (novo padrão) quanto ?token=
        const urlParams = new URLSearchParams(window.location.search);
        const profissionalId = urlParams.get('prof') || urlParams.get('token');

        if (!profissionalId) {
            document.querySelector('.glass-panel').innerHTML = '<div class="text-center py-8"><i data-lucide="alert-circle" class="w-16 h-16 text-red-500 mx-auto mb-4"></i><h2 class="text-xl font-bold text-white mb-2">Convite Inválido</h2><p class="text-slate-400">O link fornecido está incompleto ou inválido. Solicite um novo link ao seu profissional.</p></div>';
            lucide.createIcons();
        }

        function showToast(msg, isError = true) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `absolute bottom-4 left-4 right-4 p-3 rounded-lg text-sm text-center backdrop-blur-md transition-all ${isError ? 'bg-red-500/10 border border-red-500/50 text-red-200' : 'bg-emerald-500/10 border border-emerald-500/50 text-emerald-200'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 5000);
        }

        document.getElementById('form-convite')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Aguarde...</span>';
            lucide.createIcons();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            try {
                // 1. Cria utilizador no Supabase Auth
                const { data, error: authError } = await supabaseClient.auth.signUp({
                    email,
                    password: senha,
                    options: {
                        data: {
                            role: 'aluno',
                            papel: 'aluno',
                            nome,
                            profissional_id: profissionalId
                        }
                    }
                });

                if (authError) throw authError;

                // 2. Insere na tabela alunos associando o profissional
                if (data && data.user) {
                    const novoAlunoId = data.user.id;
                    const { error: insertError } = await supabaseClient
                        .from('alunos')
                        .insert([{
                            id: novoAlunoId,
                            nome: nome,
                            email: email,
                            profissional_id: profissionalId
                        }]);

                    if (insertError && !insertError.message.includes('duplicate key')) {
                        console.warn("Aviso ao inserir na tabela alunos:", insertError);
                    }
                }

                showToast('Acesso criado com sucesso! Redirecionando...', false);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error(error);
                showToast(error.message === 'User already registered' ? 'Este e-mail já possui cadastro.' : 'Erro ao criar acesso: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Criar Meu Acesso</span><i data-lucide="arrow-right" class="w-5 h-5"></i>';
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
